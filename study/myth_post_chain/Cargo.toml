[package]
name = "myth_post_chain"
description = "Myth vs LunarFenrir study: Myth's TAA/CAS/bloom/tone-map/FXAA chain on the protocol input, headless, timed."
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
myth_app       = { workspace = true, features = ["advanced_noise"] }
myth_render    = { workspace = true, features = ["advanced_noise", "study_post_chain"] }
myth_scene     = { workspace = true }
myth_resources = { workspace = true }
wgpu           = { workspace = true }
pollster       = { workspace = true }
serde_json     = { workspace = true }
sha2           = "0.10"

[features]
# G runs: Myth's RDG GPU timestamp recorder (graph/core/gpu_timing.rs).
gpu_timing = ["myth_render/rdg_bench_support"]
